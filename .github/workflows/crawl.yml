name: 크롤러 수동 실행

# 자동 스케줄(cron) 없이 '수동 실행'만 제공한다.
# 학교 robots.txt가 크롤링을 제한하므로, 필요할 때 버튼으로만 1회 실행한다.
on:
  workflow_dispatch:

permissions:
  contents: write  # 수집한 데이터를 커밋·푸시하기 위한 권한

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 크롤러 실행 (공지·장학금 갱신)
        run: python crawler/board_crawler.py

      - name: 변경분 커밋·푸시 (Render 자동 재배포 트리거)
        run: |
          git config user.name "eunha1028"
          git config user.email "291411836+eunha1028@users.noreply.github.com"
          git add data/notices.json data/scholarships.json
          if git diff --staged --quiet; then
            echo "변경된 데이터가 없어 커밋을 생략합니다."
          else
            git commit -m "공지·장학금 데이터 갱신"
            git push
          fi
